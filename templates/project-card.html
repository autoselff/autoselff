<a class="project-card$featured" href="$page">
  <img class="project-image" src="$thumbnail" alt="" loading="lazy" />
  <div class="project-info">
    <div class="project-heading">
      <h3><span class="project-number" aria-hidden="true"></span>$title</h3>
      <span class="project-status">$status</span>
    </div>
    <div class="project-meta">$genre · $engine</div>
    <p>$description</p>
    <span class="project-action">Explore project <span aria-hidden="true">↗</span></span>
  </div>
</a>
